name: CI Pipiline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: SEt up Node.js
        uses: actions/setup-node@v3
        with:
            node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test