name: CI Pipiline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
            node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test